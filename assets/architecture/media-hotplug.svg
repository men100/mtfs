<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
<title id="title">Removable media notification path</title><desc id="desc">Card detect IRQ performs a lightweight notification. Task context debounces and confirms inserted or removed, increments media generation, and asks the application to explicitly unmount or reinitialize.</desc>
<style>.t{font:600 19px sans-serif;fill:#102a43}.s{font:16px sans-serif;fill:#243b53}.i{fill:#fff3c4;stroke:#8d6b16;stroke-width:2;rx:12}.k{fill:#d9eaf7;stroke:#486581;stroke-width:2;rx:12}.p{fill:#d8f3dc;stroke:#3b7a57;stroke-width:2;rx:12}.a{fill:none;stroke:#486581;stroke-width:3;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#486581"/></marker></defs>
<g transform="translate(35 75)"><rect class="i" width="175" height="90"/><text class="t" x="88" y="40" text-anchor="middle">Card Detect</text><text class="s" x="88" y="65" text-anchor="middle">IRQ</text></g><g transform="translate(250 75)"><rect class="i" width="210" height="90"/><text class="t" x="105" y="38" text-anchor="middle">ISR notification</text><text class="s" x="105" y="64" text-anchor="middle">raw level + sequence</text></g><g transform="translate(500 75)"><rect class="k" width="190" height="90"/><text class="t" x="95" y="40" text-anchor="middle">task context</text><text class="s" x="95" y="65" text-anchor="middle">debounce + reread</text></g><g transform="translate(730 35)"><rect class="k" width="190" height="75"/><text class="t" x="95" y="45" text-anchor="middle">INSERTED</text></g><g transform="translate(730 135)"><rect class="k" width="190" height="75"/><text class="t" x="95" y="45" text-anchor="middle">REMOVED</text></g><g transform="translate(960 75)"><rect class="p" width="205" height="90"/><text class="t" x="103" y="38" text-anchor="middle">media generation</text><text class="s" x="103" y="64" text-anchor="middle">new session identity</text></g>
<path class="a" d="M210 120H248M460 120H498M690 110L728 80M690 130L728 165M920 72L958 105M920 172L958 135"/><g transform="translate(255 270)"><rect class="p" width="690" height="80"/><text class="t" x="345" y="34" text-anchor="middle">Application action</text><text class="s" x="345" y="60" text-anchor="middle">explicit unmount · close/reinitialize device · explicit remount</text></g><path class="a" d="M1062 165C1062 240 945 230 945 268"/>
</svg>
