<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570" role="img" aria-labelledby="title desc">
<title id="title">Storage Sentinel pipeline</title><desc id="desc">Normal block I/O is passively observed. Diagnostics and timing become features, a per-card 32-window baseline and relative preprocessing feed OOD and rule checks, then CPU or NPU inference. Hotplug invalidates the baseline.</desc>
<style>.t{font:600 18px sans-serif;fill:#102a43}.s{font:15px sans-serif;fill:#243b53}.i{fill:#fff3c4;stroke:#8d6b16;stroke-width:2;rx:12}.p{fill:#d9eaf7;stroke:#486581;stroke-width:2;rx:12}.d{fill:#eadcf8;stroke:#68489d;stroke-width:2;rx:12}.r{fill:#fde2e2;stroke:#9b2c2c;stroke-width:2;rx:12}.a{stroke:#486581;stroke-width:3;marker-end:url(#a)}.x{stroke:#9b2c2c;stroke-width:3;fill:none;marker-end:url(#r)}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#486581"/></marker><marker id="r" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#9b2c2c"/></marker></defs>
<g transform="translate(25 70)"><rect class="i" width="165" height="90"/><text class="t" x="83" y="37" text-anchor="middle">Normal block I/O</text><text class="s" x="83" y="64" text-anchor="middle">no extra media I/O</text></g><g transform="translate(225 70)"><rect class="p" width="180" height="90"/><text class="t" x="90" y="37" text-anchor="middle">Passive observer</text><text class="s" x="90" y="64" text-anchor="middle">diagnostics + timing</text></g><g transform="translate(440 70)"><rect class="p" width="165" height="90"/><text class="t" x="83" y="48" text-anchor="middle">Feature window</text></g><g transform="translate(640 45)"><rect class="p" width="200" height="140"/><text class="t" x="100" y="35" text-anchor="middle">Per-card/session</text><text class="t" x="100" y="62" text-anchor="middle">baseline</text><text class="s" x="100" y="92" text-anchor="middle">up to 32 windows</text><text class="s" x="100" y="117" text-anchor="middle">preprocessing v2</text></g><g transform="translate(875 70)"><rect class="d" width="140" height="90"/><text class="t" x="70" y="37" text-anchor="middle">OOD / rule</text><text class="s" x="70" y="64" text-anchor="middle">gate</text></g><g transform="translate(1050 70)"><rect class="d" width="125" height="90"/><text class="t" x="63" y="37" text-anchor="middle">CPU / NPU</text><text class="s" x="63" y="64" text-anchor="middle">resident model</text></g><path class="a" d="M190 115H223M405 115H438M605 115H638M840 115H873M1015 115H1048"/>
<g transform="translate(800 265)"><rect class="d" width="375" height="95"/><text class="t" x="188" y="37" text-anchor="middle">Statistical change / deviation signal</text><text class="s" x="188" y="65" text-anchor="middle">validity + baseline + rules + model score</text></g><path class="a" d="M1113 160V263"/><g transform="translate(265 430)"><rect class="r" width="420" height="85"/><text class="t" x="210" y="35" text-anchor="middle">Hotplug / generation discontinuity</text><text class="s" x="210" y="62" text-anchor="middle">discard baseline and warm up again</text></g><path class="x" d="M475 430C475 355 740 355 740 187"/>
</svg>
