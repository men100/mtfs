<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">Sealed model data flow</title><desc id="desc">Host tools create a sealed package. A hardware crypto provider authenticates chunked AES-256-GCM data, model store loads plaintext into RAM, and a CPU or NPU runtime uses the resident model.</desc>
<style>.t{font:600 19px sans-serif;fill:#102a43}.s{font:16px sans-serif;fill:#243b53}.h{fill:#fff3c4;stroke:#8d6b16;stroke-width:2;rx:12}.p{fill:#d9eaf7;stroke:#486581;stroke-width:2;rx:12}.c{fill:#eadcf8;stroke:#68489d;stroke-width:2;rx:12}.m{fill:#d8f3dc;stroke:#3b7a57;stroke-width:2;rx:12}.f{fill:#fde2e2;stroke:#9b2c2c;stroke-width:2;rx:12}.a{stroke:#486581;stroke-width:3;marker-end:url(#a)}.r{stroke:#9b2c2c;stroke-width:3;fill:none;marker-end:url(#r)}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#486581"/></marker><marker id="r" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#9b2c2c"/></marker></defs>
<g transform="translate(35 55)"><rect class="h" width="205" height="100"/><text class="t" x="103" y="35" text-anchor="middle">Host tools</text><text class="s" x="103" y="62" text-anchor="middle">model + K_model</text><text class="s" x="103" y="84" text-anchor="middle">package creation</text></g><g transform="translate(280 55)"><rect class="h" width="190" height="100"/><text class="t" x="95" y="43" text-anchor="middle">Sealed package</text><text class="s" x="95" y="72" text-anchor="middle">on SD card</text></g><g transform="translate(510 55)"><rect class="c" width="240" height="100"/><text class="t" x="120" y="35" text-anchor="middle">Hardware provider</text><text class="s" x="120" y="62" text-anchor="middle">wrapped K_fleet</text><text class="s" x="120" y="84" text-anchor="middle">RSIP or SAES</text></g><g transform="translate(790 55)"><rect class="c" width="195" height="100"/><text class="t" x="98" y="35" text-anchor="middle">Chunked</text><text class="s" x="98" y="62" text-anchor="middle">AES-256-GCM</text><text class="s" x="98" y="84" text-anchor="middle">authenticate</text></g><g transform="translate(1025 55)"><rect class="p" width="140" height="100"/><text class="t" x="70" y="43" text-anchor="middle">model</text><text class="s" x="70" y="72" text-anchor="middle">store</text></g><path class="a" d="M240 105H278M470 105H508M750 105H788M985 105H1023"/>
<g transform="translate(750 250)"><rect class="m" width="260" height="100"/><text class="t" x="130" y="36" text-anchor="middle">Authenticated plaintext</text><text class="s" x="130" y="64" text-anchor="middle">caller-owned RAM</text><text class="s" x="130" y="86" text-anchor="middle">resident model</text></g><g transform="translate(1025 250)"><rect class="m" width="140" height="100"/><text class="t" x="70" y="42" text-anchor="middle">CPU / NPU</text><text class="s" x="70" y="71" text-anchor="middle">runtime</text></g><path class="a" d="M1095 155V248M1010 300H1023"/>
<g transform="translate(415 405)"><rect class="f" width="370" height="75"/><text class="t" x="185" y="33" text-anchor="middle">Authentication / policy failure</text><text class="s" x="185" y="58" text-anchor="middle">close + zeroize defined sensitive regions</text></g><path class="r" d="M888 155C888 385 600 325 600 403"/>
</svg>
