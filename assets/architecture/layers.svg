<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
<title id="title">microT-FS layered architecture</title><desc id="desc">Application and FatFs above the microT-FS core, target ports, microT-Kernel, vendor HAL, and hardware. Optional sealed model and Storage Sentinel are beside the common path.</desc>
<style>.t{font:600 22px sans-serif;fill:#102a43}.s{font:16px sans-serif;fill:#243b53}.b{stroke:#486581;stroke-width:2;rx:12}.c{fill:#d9eaf7}.u{fill:#fff3c4}.p{fill:#d8f3dc}.o{fill:#eadcf8}.h{fill:#e7ebef}.a{stroke:#486581;stroke-width:3;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#486581"/></marker></defs>
<rect class="b u" x="180" y="30" width="840" height="70"/><text class="t" x="600" y="73" text-anchor="middle">Application</text>
<rect class="b u" x="180" y="125" width="840" height="70"/><text class="t" x="600" y="168" text-anchor="middle">FatFs API (upstream)</text>
<rect class="b c" x="180" y="220" width="840" height="75"/><text class="t" x="600" y="254" text-anchor="middle">microT-FS common core</text><text class="s" x="600" y="279" text-anchor="middle">diskio bridge · registry · block device · media · RTC · diagnostics</text>
<rect class="b o" x="30" y="330" width="350" height="105"/><text class="t" x="205" y="369" text-anchor="middle">Optional sealed model</text><text class="s" x="205" y="397" text-anchor="middle">model store · crypto provider</text><text class="s" x="205" y="419" text-anchor="middle">wrapped key · authenticated load</text>
<rect class="b o" x="820" y="330" width="350" height="105"/><text class="t" x="995" y="369" text-anchor="middle">Optional Storage Sentinel</text><text class="s" x="995" y="397" text-anchor="middle">passive observation · baseline</text><text class="s" x="995" y="419" text-anchor="middle">OOD/rules · CPU/NPU inference</text>
<rect class="b p" x="180" y="470" width="400" height="95"/><text class="t" x="380" y="509" text-anchor="middle">RA target port</text><text class="s" x="380" y="537" text-anchor="middle">SPI SD · RSIP-E50D · Ethos-U55</text>
<rect class="b p" x="620" y="470" width="400" height="95"/><text class="t" x="820" y="509" text-anchor="middle">ST target port</text><text class="s" x="820" y="537" text-anchor="middle">SDMMC · SAES · Neural-ART</text>
<rect class="b h" x="180" y="600" width="840" height="70"/><text class="t" x="600" y="643" text-anchor="middle">microT-Kernel 3.0</text><rect class="b h" x="180" y="705" width="840" height="70"/><text class="t" x="600" y="748" text-anchor="middle">Vendor HAL / hardware</text>
