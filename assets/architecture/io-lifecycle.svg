<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570" role="img" aria-labelledby="title desc">
<title id="title">Normal I/O data flow and lifecycle</title><desc id="desc">FatFs requests flow through diskio, registry, block device, a target port and an SD card. Lifecycle proceeds from initialize through register and mount, then unmount, unregister and deinitialize.</desc>
<style>.t{font:600 20px sans-serif;fill:#102a43}.s{font:16px sans-serif;fill:#243b53}.b{fill:#d9eaf7;stroke:#486581;stroke-width:2;rx:12}.l{fill:#d8f3dc;stroke:#3b7a57;stroke-width:2;rx:18}.a{stroke:#486581;stroke-width:3;marker-end:url(#a)}.r{stroke:#9b2c2c;stroke-width:3;fill:none;marker-end:url(#r)}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#486581"/></marker><marker id="r" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#9b2c2c"/></marker></defs>
<text class="t" x="40" y="45">Sector data path</text>
<g transform="translate(35 75)"><rect class="b" width="160" height="80"/><text class="t" x="80" y="47" text-anchor="middle">FatFs</text></g><g transform="translate(235 75)"><rect class="b" width="160" height="80"/><text class="t" x="80" y="38" text-anchor="middle">diskio</text><text class="s" x="80" y="62" text-anchor="middle">bridge</text></g><g transform="translate(435 75)"><rect class="b" width="160" height="80"/><text class="t" x="80" y="38" text-anchor="middle">block</text><text class="s" x="80" y="62" text-anchor="middle">registry</text></g><g transform="translate(635 75)"><rect class="b" width="160" height="80"/><text class="t" x="80" y="38" text-anchor="middle">block device</text><text class="s" x="80" y="62" text-anchor="middle">ops + context</text></g><g transform="translate(835 75)"><rect class="b" width="160" height="80"/><text class="t" x="80" y="38" text-anchor="middle">RA SPI SD</text><text class="s" x="80" y="62" text-anchor="middle">or ST SDMMC</text></g><g transform="translate(1035 75)"><rect class="b" width="130" height="80"/><text class="t" x="65" y="47" text-anchor="middle">SD card</text></g>
<path class="a" d="M195 115H233M395 115H433M595 115H633M795 115H833M995 115H1033"/>
<text class="t" x="40" y="235">Application-controlled lifecycle</text>
<g transform="translate(35 270)"><rect class="l" width="150" height="70"/><text class="t" x="75" y="43" text-anchor="middle">initialize</text></g><g transform="translate(225 270)"><rect class="l" width="150" height="70"/><text class="t" x="75" y="43" text-anchor="middle">register</text></g><g transform="translate(415 270)"><rect class="l" width="150" height="70"/><text class="t" x="75" y="43" text-anchor="middle">mount</text></g><g transform="translate(605 270)"><rect class="l" width="150" height="70"/><text class="t" x="75" y="43" text-anchor="middle">file I/O</text></g><g transform="translate(795 270)"><rect class="l" width="150" height="70"/><text class="t" x="75" y="43" text-anchor="middle">unmount</text></g><g transform="translate(985 270)"><rect class="l" width="180" height="70"/><text class="t" x="90" y="43" text-anchor="middle">unregister</text></g>
<path class="a" d="M185 305H223M375 305H413M565 305H603M755 305H793M945 305H983"/><g transform="translate(985 420)"><rect class="l" width="180" height="70"/><text class="t" x="90" y="43" text-anchor="middle">deinitialize</text></g><path class="a" d="M1075 340V418"/><path class="r" d="M985 455H130C70 455 70 385 130 385H602"/><text class="s" x="480" y="485" text-anchor="middle">new media/session: initialize and mount explicitly</text>
</svg>
