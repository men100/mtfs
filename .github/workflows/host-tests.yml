name: Host tests

on:
  push:
  pull_request:

jobs:
  linux-host-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S tests/host -B build/host

      - name: Build
        run: cmake --build build/host --parallel

      - name: Test
        run: ctest --test-dir build/host --output-on-failure
